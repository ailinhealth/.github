name: Reusable Branch Flow

# Consumed as: ailinhealth/.github/.github/workflows/branch-flow.yml@main
#
# IMPORTANT: this file is live for every repo in the org the moment it lands on
# main. The `model` input exists so repos migrate one at a time:
#   model: "v1" (default) -> legacy dev -> pre -> main promotion chain
#   model: "v2"           -> trunk-based, every PR targets main
# Never change v1 behaviour while any repo still depends on it.

on:
  workflow_call:
    inputs:
      model:
        description: 'Branching model: "v1" (legacy chain) or "v2" (trunk-based).'
        type: string
        required: false
        default: "v1"

      # ---------- v2 inputs ----------
      main-allowed-prefixes:
        description: 'v2: comma-separated branch prefixes allowed to open a PR into main.'
        type: string
        required: false
        default: "feature/,fix/,hotfix/,security/,improvement/,refactor/,performance/,chore/,ci/,documentation/"

      allow-stacked-prs:
        description: >-
          v2: permit PRs whose base is another allowed-prefix branch (GitHub stacked PRs).
          Leave false until stacked PRs are out of public preview.
        type: boolean
        required: false
        default: false

      # ---------- v1 inputs (ignored when model = v2) ----------
      dev-allowed-sources:
        type: string
        required: false
        default: "*"

      pre-allowed-prefixes:
        type: string
        required: false
        default: "feature/,fix/,hotfix/"

      pre-allowed-sources-extra:
        type: string
        required: false
        default: "main"

      pro-allowed-source:
        type: string
        required: false
        default: "pre"

      # ---------- both ----------
      # Dependabot branches (dependabot/...) never match feature/|fix/|hotfix/,
      # so without this carve-out every Dependabot PR would fail here. The
      # quality gate, PR title and PR label checks still apply to them.
      allow-dependabot:
        type: boolean
        required: false
        default: true

jobs:
  branch-flow:
    name: branch-flow
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR branch flow
        shell: bash
        # Values passed via env (not inline ${{ }}) so branch names can't be
        # interpreted as shell — avoids script injection via crafted ref names.
        env:
          MODEL: ${{ inputs.model }}
          SOURCE: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ALLOW_DEPENDABOT: ${{ inputs.allow-dependabot }}
          MAIN_PREFIXES: ${{ inputs.main-allowed-prefixes }}
          ALLOW_STACKED: ${{ inputs.allow-stacked-prs }}
          PRE_EXTRA: ${{ inputs.pre-allowed-sources-extra }}
          PRE_PREFIXES: ${{ inputs.pre-allowed-prefixes }}
          PRO_SOURCE: ${{ inputs.pro-allowed-source }}
        run: |
          set -uo pipefail

          # --- merge queue -----------------------------------------------------
          # In a merge_group event there is no pull request, so head_ref/base_ref
          # are empty. Branch flow was already enforced on the PR that produced
          # this merge group. Pass trivially so this check can stay in the
          # required-status-checks list without stalling the queue.
          if [[ "${GITHUB_EVENT_NAME}" == "merge_group" ]]; then
            echo "merge_group event — branch flow already validated on the pull request."
            exit 0
          fi

          if [[ "$MODEL" != "v1" && "$MODEL" != "v2" ]]; then
            echo "::error::Unknown model '$MODEL'. Expected 'v1' or 'v2'."
            exit 1
          fi

          echo "Model:         $MODEL"
          echo "Source branch: $SOURCE"
          echo "Target branch: $TARGET"
          
          # Pointer targets are never valid under v2 — not even for Dependabot.
          # If a repo's dependabot.yml was not retargeted at cutover, this is
          # the check that catches it. See runbook §4.7.
          if [[ "$MODEL" == "v2" ]]; then
            if [[ "$TARGET" == "dev" || "$TARGET" == "pre" || "$TARGET" == "pre-eb" || "$TARGET" == "demo" ]]; then
              echo "::error::'$TARGET' is a deployment pointer, not a merge target."
              echo "Open this PR against main. To deploy to pre, add the 'deploy:pre' label."
              exit 1
            fi
          fi

          # --- Dependabot carve-out --------------------------------------------
          if [[ "$ALLOW_DEPENDABOT" == "true" ]]; then
            if [[ "$PR_AUTHOR" == "dependabot[bot]" && "$SOURCE" == dependabot/* ]]; then
              echo "Dependabot PR detected — branch-flow rules skipped."
              exit 0
            fi
          fi

          matches_prefix() {
            local branch="$1" list="$2" prefix
            IFS=',' read -ra PREFIXES <<< "$list"
            for prefix in "${PREFIXES[@]}"; do
              [[ -z "$prefix" ]] && continue
              if [[ "$branch" == "$prefix"* ]]; then
                return 0
              fi
            done
            return 1
          }

          # =====================================================================
          # v2 — trunk-based
          # =====================================================================
          if [[ "$MODEL" == "v2" ]]; then

            # Pointer targets are already rejected above, deliberately before the
            # Dependabot carve-out so a Dependabot PR into a pointer fails rather
            # than being skipped. Repeating the check here would be unreachable.
            if [[ "$TARGET" == "main" ]]; then
              if matches_prefix "$SOURCE" "$MAIN_PREFIXES"; then
                echo "PR into main allowed from $SOURCE."
                exit 0
              fi
              echo "::error::PRs into main must come from one of these prefixes: $MAIN_PREFIXES"
              echo "Branch from main and name it e.g. feature/AIL-123-short-description."
              exit 1
            fi

            # Mid-stack PR: base is another working branch.
            if [[ "$ALLOW_STACKED" == "true" ]]; then
              if matches_prefix "$TARGET" "$MAIN_PREFIXES" && matches_prefix "$SOURCE" "$MAIN_PREFIXES"; then
                echo "Stacked PR: $SOURCE -> $TARGET. Allowed."
                exit 0
              fi
            fi

            echo "::error::Unexpected target branch '$TARGET'. Under v2 every PR targets main."
            exit 1
          fi

          # =====================================================================
          # v1 — legacy promotion chain. Do not change while any repo uses it.
          # =====================================================================
          if [[ "$TARGET" == "dev" ]]; then
            echo "PRs into dev are allowed."
            exit 0
          fi

          if [[ "$TARGET" == "pre" || "$TARGET" == "pre-eb" ]]; then
            IFS=',' read -ra EXTRA <<< "$PRE_EXTRA"
            for SRC in "${EXTRA[@]}"; do
              if [[ "$SOURCE" == "$SRC" ]]; then
                echo "PR into pre allowed from $SOURCE."
                exit 0
              fi
            done

            if matches_prefix "$SOURCE" "$PRE_PREFIXES"; then
              echo "PR into pre allowed from $SOURCE."
              exit 0
            fi

            echo "PRs into pre must come from one of these prefixes: $PRE_PREFIXES"
            exit 1
          fi

          if [[ "$TARGET" == "main" ]]; then
            if [[ "$SOURCE" == "$PRO_SOURCE" ]]; then
              echo "PR into pro allowed from $SOURCE."
              exit 0
            fi
            echo "PRs into pro must come only from $PRO_SOURCE."
            exit 1
          fi

          echo "Unexpected target branch: $TARGET"
          exit 1
