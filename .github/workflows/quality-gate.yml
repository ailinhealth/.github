name: Reusable Quality Gate

on:
  workflow_call:
    inputs:
      stacks:
        required: true
        type: string
        description: "Comma-separated list: node,react,php"

      node-version:
        required: false
        type: string
        default: "22"

      php-version:
        required: false
        type: string
        default: "8.4"

      run-tests:
        required: false
        type: boolean
        default: false

      run-build:
        required: false
        type: boolean
        default: false

jobs:
  node:
    name: node
    if: contains(inputs.stacks, 'node') || contains(inputs.stacks, 'react')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run biome lint
        run: pnpm run lint

      - name: Run Node/React tests
        if: inputs.run-tests
        run: pnpm run test --if-present

      - name: Run Node/React build
        if: inputs.run-build
        run: pnpm run build --if-present

  php:
    name: php
    if: contains(inputs.stacks, 'php')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer

      - uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-progress --no-interaction --prefer-dist

      - name: Run PHPCS
        run: vendor/bin/phpcs

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

      - name: Run PHP tests
        if: inputs.run-tests
        run: composer test --if-present

  quality-gate:
    name: lint
    runs-on: ubuntu-latest
    needs:
      - node
      - php
    if: always()

    steps:
      - name: Check quality result
        run: |
          if [[ "${{ needs.node.result }}" == "failure" || "${{ needs.php.result }}" == "failure" ]]; then
            echo "Quality gate failed"
            exit 1
          fi

          if [[ "${{ needs.node.result }}" == "cancelled" || "${{ needs.php.result }}" == "cancelled" ]]; then
            echo "Quality gate cancelled"
            exit 1
          fi

          echo "Quality gate passed"
