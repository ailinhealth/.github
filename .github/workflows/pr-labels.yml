name: Reusable PR Label Check

# Consumed as: ailinhealth/.github/.github/workflows/pr-labels.yml@main

on:
  workflow_call:
    inputs:
      valid-labels:
        description: 'Comma-separated type labels. Must match config/labels.yml.'
        type: string
        required: false
        default: "feature,fix,hotfix,security,improvement,refactor,performance,chore,ci,documentation"

      mode:
        description: >-
          "at-least-one" (v1 behaviour) or "exactly-one" (v2). Two type labels
          make changelog categorisation ambiguous, so v2 repos use exactly-one.
        type: string
        required: false
        default: "at-least-one"

      require-title-label-match:
        description: >-
          When true, the type prefix in the PR title must match a type label on
          the PR. Both encode the change type, but only the label reaches the
          changelog, so a mismatch misfiles the change in the release notes with
          nothing to catch it. Skipped when the title does not parse as
          type(scope): — pr-title.yml owns that failure, and two errors for one
          mistake is worse than one.
        type: boolean
        required: false
        default: false

jobs:
  label-check:
    name: label-check
    runs-on: ubuntu-latest

    steps:
      - name: Validate label type
        shell: bash
        # Label names arrive via env, not inline ${{ }}. A label containing a
        # quote would otherwise break out of the shell string.
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          VALID_LABELS: ${{ inputs.valid-labels }}
          MODE: ${{ inputs.mode }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REQUIRE_MATCH: ${{ inputs.require-title-label-match }}
        run: |
          set -uo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "merge_group" ]]; then
            echo "merge_group event — labels already validated on the pull request."
            exit 0
          fi

          if [[ "$MODE" != "at-least-one" && "$MODE" != "exactly-one" ]]; then
            echo "::error::Unknown mode '$MODE'. Expected 'at-least-one' or 'exactly-one'."
            exit 1
          fi

          VALID_JSON=$(jq -cRn --arg v "$VALID_LABELS" '$v | split(",") | map(gsub("^\\s+|\\s+$";""))')

          # Only type labels count. Workflow labels (deploy:pre, blocked,
          # needs-qa, ...) and control labels are intentionally ignored here.
          MATCHED=$(jq -c -n \
            --argjson pr "$LABELS_JSON" \
            --argjson valid "$VALID_JSON" \
            '$pr - ($pr - $valid)')

          COUNT=$(echo "$MATCHED" | jq 'length')

          echo "PR labels:     $(echo "$LABELS_JSON" | jq -c .)"
          echo "Type labels:   $MATCHED"
          echo "Mode:          $MODE"

          if [[ "$COUNT" -eq 0 ]]; then
            echo "::error::PR must have one type label: $VALID_LABELS"
            exit 1
          fi

          if [[ "$MODE" == "exactly-one" && "$COUNT" -gt 1 ]]; then
            echo "::error::PR has $COUNT type labels: $MATCHED"
            echo "Exactly one is required — the changelog category is derived from it."
            exit 1
          fi

          echo "Valid label(s): $MATCHED"

          # ---- title / label agreement ----------------------------------------
          if [[ "$REQUIRE_MATCH" == "true" ]]; then
            # Same shape pr-title.yml enforces: type, optional scope, colon,
            # space. A looser match here would claim a malformed title parsed
            # and report a second error for the same mistake.
            if [[ "$PR_TITLE" =~ ^([a-z]+)(\([a-z0-9-]+\))?:[[:space:]] ]]; then
              TITLE_TYPE="${BASH_REMATCH[1]}"

              if ! echo "$VALID_JSON" | jq -e --arg t "$TITLE_TYPE" 'index($t)' >/dev/null; then
                echo "::notice::Title type '$TITLE_TYPE' is not a known type — validate-title owns that. Skipping match check."
              elif ! echo "$MATCHED" | jq -e --arg t "$TITLE_TYPE" 'index($t)' >/dev/null; then
                echo "::error::Title says '$TITLE_TYPE' but the type label(s) say $MATCHED."
                echo ""
                echo "The label drives the changelog category and therefore the release notes."
                echo "The title is what a person reads. They have to agree — change whichever"
                echo "one is wrong."
                exit 1
              else
                echo "Title type '$TITLE_TYPE' agrees with the label(s)."
              fi
            else
              echo "::notice::Title does not parse as type(scope): — validate-title owns that. Skipping match check."
            fi
          fi
